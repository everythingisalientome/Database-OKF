[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okf"
version = "0.1.0"
description = "Read and write OKF bundles for the SOR data discovery pipelines"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
# Database drivers, one extra per engine: a PostgreSQL crawl running as an
# OpenShift job should not need a Teradata driver installed to start.
postgres = ["psycopg[binary]>=3.1"]
sqlserver = ["pymssql>=2.3"]
teradata = ["teradatasql>=17.20"]
# The llm annotator's client for OpenAI-compatible endpoints; a Tier A-only
# crawl job should not need an LLM client installed to start.
llm = ["openai>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "acceptance: needs the live rig (docker compose -f rig/docker-compose.yml up -d --wait)",
]
